name: Trade Performance (실제 거래 성과)

env:
  DISCORD_REPORTS_ENABLED: "true"
  DISCORD_WEBHOOKS_JSON_BASE64: ${{ secrets.DISCORD_WEBHOOKS_JSON_BASE64 }}

permissions:
  contents: read

on:
  schedule:
    # KST Friday 17:40 = UTC 08:40. Recommendation evaluations still run daily.
    - cron: '40 8 * * 5'
  workflow_dispatch:

concurrency:
  group: economic-agent-trade-performance
  cancel-in-progress: false

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/cache@v5
        with:
          path: data/
          key: data-${{ github.run_id }}
          restore-keys: data-

      - run: npm ci
      - name: Build and send trade performance
        run: node scripts/trade-performance.js
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Notify Discord on failure
        if: failure()
        run: npm run notify:workflow-failure -- "Trade Performance (실제 거래 성과)" "Build and send trade performance"
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
