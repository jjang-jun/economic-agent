name: Stock Report (장 마감 분석)

env:
  DISCORD_REPORTS_ENABLED: "true"
  DISCORD_WEBHOOKS_JSON_BASE64: ${{ secrets.DISCORD_WEBHOOKS_JSON_BASE64 }}

permissions:
  contents: read

on:
  schedule:
    # KST 16:00 = UTC 07:00 (월~금)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: economic-agent-stock-report
  cancel-in-progress: false

jobs:
  stock-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/cache@v5
        with:
          path: data/
          key: data-${{ github.run_id }}
          restore-keys: data-

      - uses: actions/cache@v5
        with:
          path: .cache/
          key: finbert-model-v1
          restore-keys: finbert-model-

      - run: npm ci
      - name: Build and send stock report
        run: node src/stock-report.js
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_STOCK_MODEL: ${{ secrets.AI_STOCK_MODEL }}
          AI_REASONING_EFFORT: ${{ secrets.AI_REASONING_EFFORT }}
          AI_STOCK_REASONING_EFFORT: ${{ secrets.AI_STOCK_REASONING_EFFORT }}
          AI_VERBOSITY: ${{ secrets.AI_VERBOSITY }}
          AI_STOCK_VERBOSITY: ${{ secrets.AI_STOCK_VERBOSITY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SAFETY_IDENTIFIER: ${{ secrets.OPENAI_SAFETY_IDENTIFIER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PORTFOLIO_JSON_BASE64: ${{ secrets.PORTFOLIO_JSON_BASE64 }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Notify Discord on failure
        if: failure()
        run: npm run notify:workflow-failure -- "Stock Report (장 마감 분석)" "Build and send stock report"
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
