name: Discord Infrastructure Smoke

env:
  DISCORD_REPORTS_ENABLED: "true"
  DISCORD_WEBHOOKS_JSON_BASE64: ${{ secrets.DISCORD_WEBHOOKS_JSON_BASE64 }}

permissions:
  contents: read

on:
  schedule:
    # 월~금 08:10 KST = 일~목 23:10 UTC. 첫 장전 브리핑 전에 Discord 전달 경로를 확인한다.
    - cron: '10 23 * * 0-4'
  workflow_dispatch:
    inputs:
      channel:
        description: Discord channel key to test
        required: false
        default: ops
        type: choice
        options:
          - ops
          - policy_tax
          - policy_real_estate
          - action
          - briefing
          - portfolio
          - pre_news
          - performance
          - urgent

concurrency:
  group: economic-agent-discord-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Validate and send Discord smoke
        run: npm run discord:smoke -- --channel=${{ inputs.channel || 'ops' }}
        env:
          DISCORD_WEBHOOKS_JSON_BASE64: ${{ secrets.DISCORD_WEBHOOKS_JSON_BASE64 }}

      - name: Notify Discord on failure
        if: failure()
        run: npm run notify:workflow-failure -- "Discord Infrastructure Smoke" "Validate and send Discord smoke"
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
